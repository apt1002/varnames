[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "varnames"
version = "0.1.0"
description = "Encode programming-language identifiers as 64- or 128-bit integers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "LICENSE-CC0"]
authors = [{ name = "Alistair Turnbull", email = "varnames@minworks.co.uk" }]
keywords = ["identifier", "compression", "huffman", "bijection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/apt1002/varnames"
Documentation = "https://github.com/apt1002/varnames/blob/main/standard/STANDARD.md"
Source = "https://github.com/apt1002/varnames"

[project.scripts]
varnames = "varnames.cli:main"

[tool.setuptools]
packages = ["varnames"]

[tool.setuptools.package-data]
varnames = ["data/*.nvm1", "data/*.txt", "py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 79

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# The package is *about* confusable letters (ı, ſ, σ) and dashes, and `V` is a
# model size rather than a constant, so these heuristics are noise here.
ignore = ["RUF001", "RUF002", "RUF003", "SIM300"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["varnames"]
